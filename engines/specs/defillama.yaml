# DeFiLlama 协议 TVL（免 key）
#
# 补的盲区：**链上资金规模**。现有 crypto 源只有 CoinGecko（币价/市值），
# 没有「协议里锁了多少钱」这个口径。DeFiLlama 是 DeFi TVL 的事实标准，
# 免 key、免注册，覆盖 8700+ 协议与 300+ 链。
#
# 端点语义（2026-10-21 实测）：单次返回全量协议列表（约 9 MB / 2.4s），
# 不支持关键词查询，builder 本地过滤（名称/代号/类别/链）并按 TVL 排序。
# 全量结果进程内缓存 5 分钟，连续查询不重复下载。
#   GET /protocols → [{name, symbol, category, chain, chains, tvl,
#                      change_1d, change_7d, slug, url, description}]
#
# 验证:
#   python3 scripts/engine_validate.py --engine defillama --stage health --admit
#   argo search "aave tvl" --engine defillama --json

engine_id: defillama
type: defillama
enabled: true
cost_tier: free
label: DeFiLlama
family: finance_market
priority: 45
qps: 1
period: second
cost_per_call: 0.0
cost_unit: free
recommended: false

timeout: 30
canary_query: aave
desc: "DeFiLlama 协议 TVL（8700+ 协议资金规模/24h 与 7d 变化，免 key）"
coverage: [crypto, finance, blockchain, defi]

quality_queries:
  - query: aave tvl
  - query: uniswap 锁仓
  - query: Lido 质押 规模
