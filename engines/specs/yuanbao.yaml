# 腾讯元宝搜索（Tencent WSA SearchPro，需 key）——默认开，无 key 时路由自动跳过
#
# 它是什么：腾讯云「联网搜索」的元宝口径（POST api.wsa.cloud.tencent.com/SearchPro）。
# 中文全网检索，返回**权威源占比很高**：实测「三星堆的由来」10 条里 8 条来自
# 人民日报 / 新华网 / 国家文物局 / 住建部 / 国家民委 / 中国日报 / 中新网 /
# 中国经济网，另 2 条为环球网与腾讯新闻。这与 bocha/byted 的「门户+自媒体」
# 构成互补——同一个查询上，它更偏一手/官方口径。
#
# 返回字段（实测）：passage（摘要 ~800 字）、content（更长正文 ~2000 字）、
# score（相关度 0.55-0.65 区间）、date（`YYYY/MM/DD HH:MM:SS`，东八区）、
# title、url、site（站点中文名，如「人民日报」）、favicon、pics。
# 搜索层只取 passage 当摘要，正文按需走 fetch/verify 链（与 DeepSeek 引擎同口径）。
#
# 为什么是独立 builder 而不是 type: http（四条声明式表达不了的事实）：
#   1. Pages 是 **JSON 字符串数组**，要二次解析
#   2. 错误全部走 HTTP 200 + Response.Error（鉴权/欠费/限流都是），
#      声明式会把它当「0 结果」
#   3. date 是斜杠格式，不是 argo 的 ISO 约定
#   4. Cnt 只接受 10/20/30/50，传别的值回 "illegal Cnt"
# 详见 scripts/engines_builders_batch15.py 的模块 docstring。
#
# 成本口径：**未知**。官方文档未公布单价，只有 ResourceUnavailable「请检查账号
# 是否欠费」这一条侧面说明它按量计费。故 cost_per_call 记 0.0（预算层因此不会
# 扣减），并用 explicit_only 把它挡在自动路由之外——在价格与额度未知之前，
# 不让它进任何域 combo，避免「自动花钱却算不出花了多少」。补齐价格后再按
# scripts/paid_policy.py 的既有做法决定是否放进白名单域的付费对冲位。
#
# 启用前提：
#   1. 配置 key（两个名字都认）：
#        ARGO_YUANBAO_API_KEY=<key>      # argo 推荐名
#        TENCENTCLOUD_WSA_APIKEY=<key>   # 腾讯官方名（文档里的环境变量名）
#      写进 ~/.config/argo/env 即可，只进环境不落仓库。
#   2. 健康门：python3 scripts/engine_validate.py --engine yuanbao --stage all --admit
#   3. 显式调用：argo search "三星堆的由来" --engine yuanbao --json --fields agent
#
# 实测（2026-10-21 本机）：单次 POST 0.44s，返回 10 条，响应体 ~90KB。
engine_id: yuanbao
type: yuanbao
enabled: true
# 价格未知之前不进自动路由：只经 --engine 显式调用（同 deepseek_search 的口径）
explicit_only: true
cost_tier: api
method: POST
url: https://api.wsa.cloud.tencent.com/SearchPro
timeout: 12
canary_query: 三星堆的由来
label: 腾讯元宝搜索
family: web_general
priority: 55
# 上游有 RequestLimitExceeded，但公开文档未给具体 QPS；保守取 2，避免撞限流
qps: 2
period: second
cost_per_call: 0.0
cost_unit: cny
recommended: false

# key 候选链：任一有值即视为就绪（解析见 engine_env.missing_env_for）
required_env:
  - [ARGO_YUANBAO_API_KEY, TENCENTCLOUD_WSA_APIKEY, YUANBAO_API_KEY]

coverage: [web, chinese, news, official]

quality_queries:
  - query: 三星堆的由来
  - query: 央行 降准 最新
  - query: 国家统计局 一季度 GDP
