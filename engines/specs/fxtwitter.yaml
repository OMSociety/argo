# FxTwitter / FxEmbed 公开 API — X/Twitter 推文搜索（零 Key）
# 文档: https://docs.fxembed.com/api/twitter/
# 验证:
#   python3 scripts/engine_validate.py --engine fxtwitter --stage all --admit --write-doc
#   python3 scripts/search.py "OpenAI" --engine fxtwitter --json

engine_id: fxtwitter
type: http
# 状态注记（2026-10-21 实测）：上游 /2/search 搜索端点已停用（对任意查询返回
# 空 results，强制调用 6.3s 零结果），status/profile 端点仍正常但不属本引擎职责。
# X 关键词搜索走 `argo x-search`（ego-browser 通道，见 config.yaml 的 twitter 引擎）
# 或 `--engine twitter`；单条推文按 URL 取正文仍走 `argo tweet`（twitter_syndication）。
# 保留注册：上游若恢复搜索端点可直接复用，声明本身无需改动。
enabled: true
cost_tier: free
method: GET
url: https://api.fxtwitter.com/2/search
timeout: 10
query_param: q
canary_query: "OpenAI"
desc: "FxTwitter 公开 API：X/Twitter 推文搜索（零认证，含互动元数据）"
coverage: [social, english]
recommended: false

headers:
  User-Agent: argo-search/1.0 (+fxtwitter)
  Accept: application/json

extra_params:
  count: "{n}"

output_map:
  items: results
  item_title: text
  item_url: url
  item_summary: text
